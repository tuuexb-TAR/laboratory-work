<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-4">
    <title>Таблиця множення</title>
</head>
<body>
    <div id="output"></div>

    <script type="module">
        const digit = 4;
        const output = document.getElementById('output');
        let htmlContent = `<h3>Таблиця множення для числа ${digit}</h3>`;

        for (let i = 1; i <= 10; i++) {
            htmlContent += `${digit} * ${i} = ${digit * i}<br>`;
        }

        output.innerHTML = htmlContent;
    </script>
</body>
</html>
